name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: deancron/landrecon

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:r${{ github.run_id }}
          build-args: |
            VITE_NOISE_PMTILES_URL=${{ vars.NOISE_PMTILES_URL }}
            VITE_GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}
            BUILD_GIT_HASH=${{ github.sha }}
          secrets: |
            VITE_TOMTOM_API_KEY=${{ secrets.TOMTOM_API_KEY }}
            VITE_GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Direct `az containerapp update` instead of azure/container-apps-deploy-action@v2,
      # which still ships as Node 16 in its action.yml and trips the Node-version
      # deprecation warning. The action is a thin wrapper around this CLI call for our
      # update-existing-app use case, so the CLI form is equivalent.
      #
      # --min-replicas 1 keeps one container warm to avoid the ~60s cold-start while
      # the entrypoint pulls the 4 GB broadband.db from blob storage. Worth the cost.
      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:r${{ github.run_id }}" \
            --min-replicas 1 \
            --max-replicas 3
