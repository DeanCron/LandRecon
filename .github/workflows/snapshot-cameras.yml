name: Snapshot ALPR cameras

# Nightly Overpass crawl of CONUS ALPR cameras (Flock + others) tagged in
# OpenStreetMap by the DeFlock project. Uploads a single gzipped JSON blob
# the client fetches in place of dozens of per-bbox Overpass calls.

on:
  schedule:
    # Daily at 09:00 UTC (~04:00–05:00 ET). Off-peak for Overpass.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch CONUS cameras from Overpass
        run: node scripts/snapshot-cameras.mjs

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload snapshot to blob
        run: |
          set -e
          ls -lh dist-snapshots/

          # Upload the gzipped payload as cameras-us.json with
          # Content-Encoding: gzip so browsers auto-decompress on receipt.
          # Cache 6h at the CDN edge / browser — the file changes once daily.
          az storage blob upload \
            --account-name landreconstorage \
            --container-name snapshots \
            --name cameras-us.json \
            --file dist-snapshots/cameras-us.json.gz \
            --content-cache "public, max-age=21600" \
            --content-encoding "gzip" \
            --content-type "application/json; charset=utf-8" \
            --auth-mode login \
            --overwrite

          echo ""
          echo "Snapshot URL:"
          echo "  https://landreconstorage.blob.core.windows.net/snapshots/cameras-us.json"
