name: Snapshot Overpass datasets

# Nightly Overpass crawl of every CONUS dataset that the client otherwise
# fetches per-bbox at runtime. Each script writes its own gzipped JSON to
# dist-snapshots/; the upload step pushes everything to the public
# `snapshots` container on landreconstorage.
#
# Scripts run sequentially (not in parallel) to stay polite with the public
# overpass-api.de endpoint. Total runtime ~10-25 min depending on tile
# response times.
#
# To add a new dataset:
#   1. Drop a new scripts/snapshot-{name}.mjs (use snapshot-cameras.mjs as
#      a template — they all share scripts/lib/conus-crawl.mjs).
#   2. Add `node scripts/snapshot-{name}.mjs` to the "Fetch snapshots" step.
#   3. The upload step picks up the new dist-snapshots/{name}-us.json.gz
#      automatically (glob upload), no workflow edits needed there.

on:
  schedule:
    # Daily at 09:00 UTC (~04:00–05:00 ET). Off-peak for Overpass.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Per-script steps with continue-on-error so one Overpass tile timeout
      # doesn't kill the whole pipeline — we'd rather upload partial/stale
      # snapshots than no snapshots. Each script also tolerates partial tile
      # failures internally and writes the snapshot with a `partial: true`
      # flag if any tile was lost.
      - name: Snapshot cameras
        run: node scripts/snapshot-cameras.mjs
        continue-on-error: true

      - name: Snapshot crowd magnets
        run: node scripts/snapshot-crowd.mjs
        continue-on-error: true

      - name: Snapshot rail/subway/tram stops
        run: node scripts/snapshot-transit-stops.mjs
        continue-on-error: true

      - name: Snapshot rail/subway/tram lines
        run: node scripts/snapshot-transit-lines.mjs
        continue-on-error: true

      - name: Inventory built snapshots
        id: inventory
        run: |
          echo "Built snapshots:"
          ls -lh dist-snapshots/ || true
          expected=(cameras-us crowd-us transit-stops-us transit-lines-us)
          missing=()
          for name in "${expected[@]}"; do
            if [ ! -s "dist-snapshots/$name.json.gz" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing snapshots (blob keeps prior version): ${missing[*]}"
          fi
          count=$(ls dist-snapshots/*.json.gz 2>/dev/null | wc -l)
          echo "built_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::error::No snapshots built — nothing to upload"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload snapshots to blob
        run: |
          set -e
          for gz in dist-snapshots/*.json.gz; do
            blob_name="$(basename "$gz" .gz)"   # cameras-us.json.gz -> cameras-us.json
            echo "→ uploading $gz as snapshots/$blob_name"
            az storage blob upload \
              --account-name landreconstorage \
              --container-name snapshots \
              --name "$blob_name" \
              --file "$gz" \
              --content-cache "public, max-age=86400, immutable" \
              --content-encoding "gzip" \
              --content-type "application/json; charset=utf-8" \
              --auth-mode login \
              --overwrite
          done
          echo ""
          echo "Snapshot URLs:"
          for gz in dist-snapshots/*.json.gz; do
            blob_name="$(basename "$gz" .gz)"
            echo "  https://landreconstorage.blob.core.windows.net/snapshots/$blob_name"
          done
