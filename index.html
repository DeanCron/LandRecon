<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="16x16 24x24 32x32 48x48 64x64" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Canonical URL — overwritten per-URL by the OG sidecar for crawler
         requests to /map. Static base value is the brand homepage. Update
         the hostname when a custom domain is wired up. -->
    <link rel="canonical" href="https://landrecon.livelybush-ee6a3eea.eastus.azurecontainerapps.io/" />
    <meta name="geo.region" content="US" />
    <meta name="geo.placename" content="United States" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0072B2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Land Recon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Land Recon" />

    <!-- Search + sharing surface text. The OG/Twitter tags below upgrade
         pasted links (iMessage, Slack, Discord, Twitter, Facebook, LinkedIn)
         from a bare URL into a card with the og-image preview + this title
         and description. SPA URL params change client-side but crawlers
         only ever see this base index.html, so previews are brand-level
         (not address-personalized).

         og:image MUST be an absolute URL for Apple's iMessage Link
         Preview (and a few older crawlers) to render the card. Update
         the hostname here when a custom domain is wired up. -->
    <meta name="description" content="Neighborhood land intelligence — airport noise, Superfunds, transit, traffic, cameras, and more on one interactive map." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Land Recon" />
    <meta property="og:title" content="Land Recon — Neighborhood land intelligence" />
    <meta property="og:description" content="Airport noise, Superfunds, transit, traffic, cameras, data centers, and crowd magnets — all on one interactive map." />
    <meta property="og:url" content="https://landrecon.livelybush-ee6a3eea.eastus.azurecontainerapps.io/" />
    <meta property="og:image" content="https://landrecon.livelybush-ee6a3eea.eastus.azurecontainerapps.io/og-image.png" />
    <meta property="og:image:secure_url" content="https://landrecon.livelybush-ee6a3eea.eastus.azurecontainerapps.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Land Recon — a reticle logo over a subtle map grid scattered with location pins." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Land Recon — Neighborhood land intelligence" />
    <meta name="twitter:description" content="Airport noise, Superfunds, transit, traffic, cameras, data centers, and crowd magnets — all on one interactive map." />
    <meta name="twitter:image" content="https://landrecon.livelybush-ee6a3eea.eastus.azurecontainerapps.io/og-image.png" />
    <meta name="twitter:image:alt" content="Land Recon — a reticle logo over a subtle map grid scattered with location pins." />

    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://tile.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://api.tomtom.com" crossorigin />
    <link rel="dns-prefetch" href="https://overpass-api.de" />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://tile.googleapis.com" />
    <link rel="dns-prefetch" href="https://api.tomtom.com" />
    <title>Land Recon — Neighborhood land intelligence</title>

    <!-- Structured data: WebApplication describes what the site is, and
         WebSite + SearchAction tells Google how to construct a sitelinks
         search box that deep-links straight into /map?address=… . The
         search URL must match the actual route the SPA accepts. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "Land Recon",
          "url": "https://landrecon.livelybush-ee6a3eea.eastus.azurecontainerapps.io/",
          "description": "Look up airport noise, Superfund sites, data centers, transit, traffic, cameras, and crowd magnets by U.S. street address on one interactive map.",
          "applicationCategory": "Mapping",
          "operatingSystem": "Web",
          "browserRequirements": "Requires JavaScript and a modern browser.",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "inLanguage": "en-US",
          "isAccessibleForFree": true
        },
        {
          "@type": "WebSite",
          "name": "Land Recon",
          "url": "https://landrecon.livelybush-ee6a3eea.eastus.azurecontainerapps.io/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://landrecon.livelybush-ee6a3eea.eastus.azurecontainerapps.io/map?address={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { injectIntoGlobalHook } from "/@react-refresh";
      injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
