# LandRecon SPA — nginx static serving config.
#
# Container Apps targets port 8000 (set via `--target-port 8000`), so nginx
# listens on the same port to keep ingress unchanged. All requests fall
# through to `index.html` for client-side routing.

# Tell nginx about the PMTiles MIME type so `Content-Type` is meaningful for
# the locally-bundled fallback archive. Range requests are supported by
# nginx for static files out of the box.
types {
    application/vnd.pmtiles  pmtiles;
}

# Detect link-preview / OG-card crawlers so we can serve them an
# address-personalized share page (with per-URL og:title/og:image)
# instead of the static SPA shell. Real browsers fall through to the
# normal try_files path and the React app boots as usual.
map $http_user_agent $is_crawler {
    default                          0;
    "~*facebookexternalhit"          1;
    "~*facebookcatalog"              1;
    "~*Facebot"                      1;
    "~*Twitterbot"                   1;
    "~*LinkedInBot"                  1;
    "~*Slackbot"                     1;
    "~*Slack-ImgProxy"               1;
    "~*Discordbot"                   1;
    "~*WhatsApp"                     1;
    "~*TelegramBot"                  1;
    "~*SkypeUriPreview"              1;
    "~*Mastodon"                     1;
    "~*Pinterest"                    1;
    "~*Bingbot"                      1;
    "~*Embedly"                      1;
    "~*redditbot"                    1;
    "~*Iframely"                     1;
    "~*Applebot"                     1;
    "~*iMessage"                     1;
    "~*LinkPreview"                  1;
    "~*OpenGraph"                    1;
    "~*Google-PageRenderer"          1;
    "~*Yahoo! Slurp"                 1;
}

# Azure Container Apps terminates TLS at its front door, so the request
# arrives at nginx over HTTP (`$scheme = http`). Prefer the upstream's
# X-Forwarded-Proto header when present so the sidecar generates absolute
# https:// URLs in og:image / og:url. Falls back to $scheme for local /
# direct connections.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Rate-limit zones (must live in http{} context, which conf.d/*.conf is
# loaded into). Both buckets are keyed on the real client IP forwarded by
# Container Apps' front door. Burst values let legitimate users zoom/pan a
# few times in quick succession without 503ing; sustained abuse gets
# throttled.
limit_req_zone $http_x_forwarded_for zone=overpass_zone:10m rate=10r/s;
limit_req_zone $http_x_forwarded_for zone=devtodos_zone:1m  rate=2r/s;
limit_req_status 429;

# Scrubbed access-log format: replaces $request (which contains the raw
# request line including ?address=…) with $request_method + $uri so
# query strings — where user-typed addresses live — never hit the log.
log_format scrubbed '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

server {
    listen       8000 default_server;
    listen       [::]:8000 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Use the scrubbed log format so addresses don't end up in container
    # stdout / Azure Log Analytics.
    access_log /var/log/nginx/access.log scrubbed;

    # Security + SEO headers applied to every response. Correlates with
    # ranking and silences common Lighthouse / observatory findings.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # Force HTTPS for one year on this host and all subdomains. Azure's
    # front door already redirects HTTP → HTTPS, but HSTS protects the
    # initial request on repeat visits.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content-Security-Policy: lock down what the page is allowed to load.
    # Explicit allow-list per directive — no wildcard sources except for
    # img-src (map tiles legitimately come from many subdomains).
    #   - 'unsafe-inline' is required for the JSON-LD <script> block in
    #     index.html; tighten to a hash later if we eliminate other inline
    #     scripts.
    #   - connect-src lists every third-party API the SPA calls directly.
    #   - upgrade-insecure-requests transparently upgrades any stray
    #     http:// asset reference.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.tomtom.com https://*.googleapis.com https://www.google-analytics.com https://*.google-analytics.com https://*.arcgis.com https://gispub.epa.gov https://hazards.fema.gov https://imagery.geoplatform.gov https://landreconstorage.blob.core.windows.net https://overpass-api.de https://overpass.kumi.systems; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # gzip compresses text assets; binary PMTiles tiles handle their own
    # compression internally so they are excluded.
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types         text/plain text/css application/json
                       application/javascript application/xml
                       application/xml+rss image/svg+xml;

    # Single-page-app routing: any path not matching a file or directory
    # falls back to the React shell. index.html must never be cached — it
    # references hashed JS/CSS assets that change every deploy, and mobile
    # browsers (especially Safari) otherwise keep serving the previous
    # deploy's HTML for hours.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # /map is the only route with shareable per-URL state (address +
    # active layers + base map). Link-preview crawlers get forked to the
    # OG sidecar which injects an address-personalized og:title +
    # og:image; real browsers fall through to the SPA shell. The
    # `error_page 418` trick is the canonical way to do conditional
    # internal redirects without falling into nginx's "if is evil"
    # pitfalls.
    location = /map {
        error_page 418 = @share_for_crawler;
        if ($is_crawler) { return 418; }
        try_files /index.html =500;
    }
    # Same crawler-fork for the homepage so search bots get a server-
    # rendered <h1> + body copy instead of the empty SPA shell. Real
    # browsers still get the static index.html (handled by `location /`
    # below).
    location = / {
        error_page 418 = @share_for_crawler;
        if ($is_crawler) { return 418; }
        try_files /index.html =500;
    }
    location @share_for_crawler {
        proxy_pass http://127.0.0.1:3002/share$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # Per-address OG image. Cached aggressively at the CDN/browser edge
    # since the URL itself is the cache key (different ?address= →
    # different file). The sidecar has its own in-memory LRU too.
    location = /og.png {
        proxy_pass http://127.0.0.1:3002/og.png$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        # Cache-Control is already set by the sidecar; don't double it.
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static privacy policy. Served from /privacy (clean URL) but the
    # file is /privacy.html on disk so the SPA fallback for unknown
    # routes doesn't accidentally swallow it.
    location = /privacy {
        try_files /privacy.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Vite-emitted hashed assets (/assets/*.{js,css,webp,…}) get a year-long
    # immutable cache. Filenames change every build, so the browser never
    # needs to revalidate — second-visit load is effectively instant.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Service worker — never cache so users always get the freshest SW on
     # the next visit (Workbox precache itself handles versioning of the
     # cached assets).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
    }

    # PMTiles fallback bundled with the image. Adds a sensible cache header
    # and explicit Accept-Ranges so the client never has to guess.
    location ~ \.pmtiles$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
    }

    # Same-origin proxy to the Overpass API. We inject a non-Mozilla
    # User-Agent server-side because overpass-api.de returns 406 to
    # generic browser UAs (and the browser's CORS preflight UA is not
    # overridable from JavaScript). Routing through nginx makes this a
    # same-origin call from the SPA, so no preflight is needed.
    location = /overpass {
        # Throttle to keep us from being a free public Overpass proxy.
        limit_req zone=overpass_zone burst=30 nodelay;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $overpass_upstream "overpass-api.de";
        proxy_pass https://$overpass_upstream/api/interpreter;
        proxy_set_header Host $overpass_upstream;
        proxy_set_header User-Agent "LandRecon/1.0";
        proxy_set_header Accept "application/json";
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_send_timeout    40s;
        proxy_read_timeout    40s;
        proxy_buffering off;
        client_max_body_size 16k;
    }

    # Fallback Overpass endpoint using a different public server.
    location = /overpass2 {
        limit_req zone=overpass_zone burst=30 nodelay;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $overpass_upstream "overpass.kumi.systems";
        proxy_pass https://$overpass_upstream/api/interpreter;
        proxy_set_header Host $overpass_upstream;
        proxy_set_header User-Agent "LandRecon/1.0";
        proxy_set_header Accept "application/json";
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_send_timeout    40s;
        proxy_read_timeout    40s;
        proxy_buffering off;
        client_max_body_size 16k;
    }

    # Don't log noisy favicon requests.
    location = /favicon.ico { log_not_found off; access_log off; }

    # Dev Todos sidecar (zero-dep Node process on 127.0.0.1:3001). nginx
    # rewrites /api/dev-todos -> /dev-todos so the sidecar code doesn't
    # need to know about the /api prefix. Only GET and PUT are exposed;
    # the sidecar itself rejects everything else.
    location = /api/dev-todos {
        # Rate-limit the unauthenticated dev-todos store so a single bot
        # can't wipe it on a loop. 2 r/s + burst 5 covers normal usage.
        limit_req zone=devtodos_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001/dev-todos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
        client_max_body_size 256k;
    }

    # Broadband-at-this-address lookup. Proxied to the OG sidecar (port
    # 3002, same process as /og.png and /share) which:
    #   1. Calls geo.fcc.gov server-side to resolve lat/lng -> 15-digit
    #      census block FIPS (keyless, fast).
    #   2. Looks up the block in a pre-built SQLite index of FCC BDC
    #      availability data if present, otherwise returns just the block.
    # The sidecar handles its own Cache-Control so we don't double it.
    location = /api/broadband {
        proxy_pass http://127.0.0.1:3002/api/broadband$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
    }
}
