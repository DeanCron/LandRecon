# LandRecon SPA — nginx static serving config.
#
# Container Apps targets port 8000 (set via `--target-port 8000`), so nginx
# listens on the same port to keep ingress unchanged. All requests fall
# through to `index.html` for client-side routing.

# Tell nginx about the PMTiles MIME type so `Content-Type` is meaningful for
# the locally-bundled fallback archive. Range requests are supported by
# nginx for static files out of the box.
types {
    application/vnd.pmtiles  pmtiles;
}

server {
    listen       8000 default_server;
    listen       [::]:8000 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip compresses text assets; binary PMTiles tiles handle their own
    # compression internally so they are excluded.
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types         text/plain text/css application/json
                       application/javascript application/xml
                       application/xml+rss image/svg+xml;

    # Single-page-app routing: any path not matching a file or directory
    # falls back to the React shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PMTiles fallback bundled with the image. Adds a sensible cache header
    # and explicit Accept-Ranges so the client never has to guess.
    location ~ \.pmtiles$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
    }

    # Don't log noisy favicon requests.
    location = /favicon.ico { log_not_found off; access_log off; }
}
